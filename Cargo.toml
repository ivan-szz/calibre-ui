[package]
name = "calibre-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Reads the Calibre library's metadata.db; same version toasty already pulls in.
rusqlite = "0.40"
# Password hashing for user accounts.
argon2 = "0.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Kobo sync speaks JSON.
serde_json = "1"
# Talks to the OpenID Connect provider for "Sign in with...". Already in the lockfile.
ureq = { version = "3", features = ["json"] }
# Signs users in against an LDAP directory.
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
# Reads comic pages out of CBZ files for the comic reader.
zip = { version = "2", default-features = false, features = ["deflate"] }
toasty = { version = "0.11", features = ["sqlite"] }
toasty-cli = "0.11"
tokio = { version = "1.51.1", features = ["fs", "macros", "process", "rt-multi-thread"] }
topcoat = { version = "0.11.0", default-features = false, features = ["asset", "cookie", "discover", "font-fontsource", "icon-iconify", "l10n-fluent", "mail", "mail-smtp", "multipart", "router", "runtime", "serve", "session", "tailwind", "ui", "view"] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = ["icon-iconify", "tailwind"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
